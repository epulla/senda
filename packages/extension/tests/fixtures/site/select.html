<!doctype html><meta charset="utf-8"><title>Select</title>
<form id="f"><label for="role">Role</label><select id="role" name="role"><option value="">Choose</option><option value="m">Gerente</option><option value="e">Empleado</option></select><button>Send</button></form>
<p id="state"></p><p id="sent"></p>
<script>
// Controlled like React: state changes only through change events, and render writes it back.
let state = '';
const role = document.querySelector('#role');
const render = () => { role.value = state; document.querySelector('#state').textContent = state; };
role.addEventListener('change', (event) => { state = event.target.value; render(); });
document.querySelector('#f').addEventListener('submit', (event) => { event.preventDefault(); document.querySelector('#sent').textContent = new FormData(event.target).get('role'); });
</script>
